<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YWF - Youngster Welfare Foundation</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --p:#0f4c2a;--pl:#1a7a45;--a:#f5a623;--d:#ff4757;--w:#ffa502;
  --s:#2ed573;--i:#1e90ff;--bg:#060d0a;--bg2:#0d1a12;
  --t:#e8f5ee;--tm:#7a9a85;--td:#4a6a55;
  --f:'Outfit',sans-serif;--r:14px;--rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--pl);border-radius:2px}

/* UI Essential Classes */
#loadingOverlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:14px}
.sp{width:36px;height:36px;border:3px solid rgba(26,122,69,0.2);border-top-color:var(--pl);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toastBox{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:#0f1e15;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 15px;display:flex;align-items:center;gap:10px;font-size:13px;min-width:240px;animation:tIn 0.3s ease}
@keyframes tIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--rs);font-weight:600;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none}
.bp{background:linear-gradient(135deg,var(--pl),var(--p));color:white;box-shadow:0 4px 14px rgba(26,122,69,0.3)}
.bd{background:var(--d);color:white}
.bg{background:rgba(255,255,255,0.06);color:var(--t);border:1px solid rgba(255,255,255,0.1)}

/* Layout */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;z-index:100}
.main{margin-left:240px;min-height:100vh;padding:20px}
.topbar{position:sticky;top:0;background:rgba(6,13,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;z-index:50}

/* Cards & Forms */
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:var(--r);padding:18px;margin-bottom:15px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--tm);margin-bottom:5px;text-transform:uppercase}
.fi,.fs{width:100%;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--rs);color:var(--t);outline:none}

/* Login Page Styles */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 50%,rgba(15,76,42,0.4) 0%,var(--bg) 100%)}
.lcard{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:var(--r);padding:32px;width:100%;max-width:400px}

/* Mobile Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="sp"></div><div style="color:var(--tm);font-size:12px">প্রসেস হচ্ছে...</div></div>
<div id="toastBox"></div>

<div id="loginPage" class="login-page">
    <div class="lcard">
        <div style="text-align:center; margin-bottom:25px">
            <h2 style="font-size:24px; font-weight:800">YWF LOGIN</h2>
            <p style="color:var(--tm); font-size:12px">Youngster Welfare Foundation</p>
        </div>
        <div id="lerr" style="color:var(--d); font-size:12px; margin-bottom:10px; text-align:center; display:none"></div>
        <div class="fg">
            <label class="fl">ইমেইল / ফোন</label>
            <input type="text" id="lEmail" class="fi" placeholder="01XXXXXXXXX">
        </div>
        <div class="fg">
            <label class="fl">পাসওয়ার্ড</label>
            <input type="password" id="lPass" class="fi" placeholder="******">
        </div>
        <button class="btn bp" style="width:100%" onclick="doLogin()" id="lBtn">লগইন করুন</button>
    </div>
</div>

<div id="appLayout" style="display:none">
    <aside class="sidebar">
        <div style="padding:20px; border-bottom:1px solid rgba(255,255,255,0.05)">
            <h3 id="sidebarName">--</h3>
            <p id="sidebarRole" style="font-size:11px; color:var(--tm)">সদস্য</p>
        </div>
        <nav id="snav" style="padding:15px; flex:1">
            </nav>
        <div style="padding:15px; border-top:1px solid rgba(255,255,255,0.05)">
            <button class="btn bg" style="width:100%; color:var(--d)" onclick="doLogout()"><i class="fa fa-sign-out-alt"></i> লগআউট</button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div><h2 id="topTitle">ড্যাশবোর্ড</h2></div>
            <div id="notiIcon" style="cursor:pointer; position:relative" onclick="go('notifications')">
                <i class="fa fa-bell"></i>
                <span id="notiCount" style="position:absolute; top:-5px; right:-5px; background:var(--d); font-size:10px; padding:2px 5px; border-radius:50%; display:none">0</span>
            </div>
        </div>
        <div id="mainContent" style="margin-top:20px">
            </div>
    </main>
</div>

<script>
// --- SUPABASE CONFIG ---
const SB_URL = 'https://enifukjimtnvkwzmervg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuaWZ1a2ppbXRudmt3em1lcnZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MDA4MDEsImV4cCI6MjA5NDE3NjgwMX0.2Fusm5XWViUCToQhSCAiZeyV28mESB-ZnhtD7j3zFGQ';
const { createClient } = supabase;
const db = createClient(SB_URL, SB_KEY);

// --- STATE ---
let CU = null, CUD = null, ROLE = 'member';

// --- INITIALIZE ---
async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
        CU = session.user;
        await loadUserData();
    } else {
        document.getElementById('loadingOverlay').style.display = 'none';
    }
}

async function loadUserData() {
    const { data, error } = await db.from('ywf_users').select('*').eq('email', CU.email).single();
    if (data) {
        CUD = data;
        ROLE = data.role;
        renderApp();
    } else {
        await doLogout();
    }
    document.getElementById('loadingOverlay').style.display = 'none';
}

// --- AUTH ---
async function doLogin() {
    const inp = document.getElementById('lEmail').value.trim();
    const pass = document.getElementById('lPass').value;
    const lBtn = document.getElementById('lBtn');
    const lerr = document.getElementById('lerr');

    if(!inp || !pass) return;

    lBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> লগইন হচ্ছে...';
    lBtn.disabled = true;

    // Convert phone to email if needed
    let email = inp.includes('@') ? inp : inp + "@ywf.com";

    const { data, error } = await db.auth.signInWithPassword({ email, password: pass });

    if (error) {
        lerr.textContent = "ইমেইল বা পাসওয়ার্ড ভুল!";
        lerr.style.display = "block";
        lBtn.innerHTML = "লগইন করুন";
        lBtn.disabled = false;
    } else {
        location.reload();
    }
}

async function doLogout() {
    await db.auth.signOut();
    location.reload();
}

// --- UI RENDERING ---
function renderApp() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appLayout').style.display = 'flex';
    document.getElementById('sidebarName').textContent = CUD.full_name;
    document.getElementById('sidebarRole').textContent = ROLE === 'admin' ? 'অ্যাডমিন' : (ROLE === 'super_admin' ? 'সুপার অ্যাডমিন' : 'সদস্য');
    
    buildSidebar();
    go('dashboard');
}

function buildSidebar() {
    const nav = document.getElementById('snav');
    let html = `
        <div class="ni" onclick="go('dashboard')"><i class="fa fa-chart-pie"></i> ড্যাশবোর্ড</div>
        <div class="ni" onclick="go('my_finance')"><i class="fa fa-wallet"></i> আমার হিসাব</div>
    `;

    if (ROLE !== 'member') {
        html += `
            <div style="margin:15px 0 5px; font-size:10px; color:var(--td); font-weight:700">ADMIN TOOLS</div>
            <div class="ni" onclick="go('members')"><i class="fa fa-users"></i> সদস্য তালিকা</div>
            <div class="ni" onclick="go('add_deposit')"><i class="fa fa-plus-circle"></i> জমা যোগ করুন</div>
            <div class="ni" onclick="go('investments')"><i class="fa fa-hand-holding-usd"></i> বিনিয়োগ</div>
        `;
    }
    nav.innerHTML = html;
}

// --- NAVIGATION & PAGES ---
async function go(page) {
    const content = document.getElementById('mainContent');
    document.getElementById('topTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);

    if (page === 'dashboard') {
        renderDashboard(content);
    } else if (page === 'members' && ROLE !== 'member') {
        renderMembers(content);
    } else {
        content.innerHTML = `<div class="card">এই সেকশনটি দ্রুতই আসছে...</div>`;
    }
}

async function renderDashboard(container) {
    container.innerHTML = `<div class="sp" style="margin:auto"></div>`;
    
    // Fetch summary stats from DB
    const { data: deposits } = await db.from('ywf_deposits').select('amount');
    const totalCash = deposits ? deposits.reduce((sum, d) => sum + d.amount, 0) : 0;

    container.innerHTML = `
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px">
            <div class="card" style="border-left: 4px solid var(--s)">
                <p style="font-size:11px; color:var(--tm)">মোট ফান্ড</p>
                <h2 style="color:var(--s)">৳ ${totalCash}</h2>
            </div>
            <div class="card" style="border-left: 4px solid var(--a)">
                <p style="font-size:11px; color:var(--tm)">মোট বিনিয়োগ</p>
                <h2>৳ 0</h2>
            </div>
            <div class="card" style="border-left: 4px solid var(--i)">
                <p style="font-size:11px; color:var(--tm)">চলতি মাসের জমা</p>
                <h2>৳ 0</h2>
            </div>
        </div>

        <div class="card" style="margin-top:20px">
            <h3 style="margin-bottom:15px">সাম্প্রতিক লেনদেন</h3>
            <div id="recentTx" style="font-size:13px; color:var(--tm)">কোনো লেনদেন পাওয়া যায়নি।</div>
        </div>
    `;
}

async function renderMembers(container) {
    container.innerHTML = `<div class="sp" style="margin:auto"></div>`;
    const { data: users, error } = await db.from('ywf_users').select('*').order('full_name');

    if (users) {
        let html = `<div style="display:grid; gap:10px">`;
        users.forEach(u => {
            html += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px">
                    <div>
                        <p style="font-weight:700">${u.full_name}</p>
                        <p style="font-size:11px; color:var(--tm)">${u.email}</p>
                    </div>
                    <span style="font-size:10px; background:rgba(255,255,255,0.1); padding:3px 8px; border-radius:10px">${u.role}</span>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
    }
}

// --- UTILS ---
function toast(m, type='s') {
    const box = document.getElementById('toastBox');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fa fa-${type==='s'?'check-circle':'exclamation-triangle'}"></i> ${m}`;
    box.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// START
init();
</script>
</body>
</html>
